# References:
# https://docs.github.com/en/packages/managing-github-packages-using-github-actions-workflows/publishing-and-installing-a-package-with-github-actions#publishing-a-package-using-an-action
# https://docs.docker.com/build/ci/github-actions/multi-platform/
# https://docs.docker.com/build/ci/github-actions/manage-tags-labels/
# https://docs.docker.com/build/ci/github-actions/cache/
# https://docs.docker.com/build/ci/github-actions/attestations/
# https://docs.docker.com/build/ci/github-actions/reproducible-builds/
# https://fluxcd.io/flux/guides/image-update/#imagepolicy-examples

name: Build Image

on:
  push:
    branches:
      - main
      - dev
    tags:
      - "v[0-9]*"
    paths-ignore:
      - "**.md"
      - "**.adoc"
      - CODEOWNERS
      - .editorconfig
      - .gitignore
      - .prettierignore
      - .prettierrc
      - .sops.yaml
      - docker-compose.yml
  pull_request:
    branches:
      - main
      - dev
    paths-ignore:
      - "**.md"
      - "**.adoc"
      - CODEOWNERS

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

# Serialize runs per ref. Cancel superseded PR runs to save minutes, but let
# push/tag runs finish so every commit FluxCD might deploy still produces an image.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-image:
    runs-on: ubuntu-latest
    # Ceiling so a hung QEMU arm64 build can't burn the 6h default. Raise if
    # emulated builds legitimately run longer.
    timeout-minutes: 45
    strategy:
      # One CSP's build failing shouldn't cancel the others.
      fail-fast: false
      matrix:
        # "" is the base image (no cloud CLI); the rest layer one on top via the
        # CSP build arg. Keep in sync with the Dockerfile and .gitlab-ci.yml.
        csp: ["", aws, azure, gcp, digitalocean]
    outputs:
      image_tag: ${{ steps.flux-tag.outputs.image_tag }}
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    steps:
      # Authenticate to Docker Hub so base-image pulls during the build avoid
      # anonymous rate limits. Skipped on fork PRs, which can't read the secret.
      # https://docs.docker.com/docker-hub/usage/
      - name: Login to Docker Hub
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # No git push happens here (image is pushed via buildx), so the
          # checkout token doesn't need to linger in .git/config.
          persist-credentials: false

      # Tag format build-${sha7}-${unix_timestamp} drives FluxCD image automation.
      # The commit timestamp is reused as SOURCE_DATE_EPOCH for reproducible builds.
      - name: Compute image tag and build timestamp
        id: flux-tag
        env:
          CSP: ${{ matrix.csp }}
        run: |
          TIMESTAMP="$(git log -1 --pretty=%ct)"
          SHA="$(git rev-parse --short=7 HEAD)"
          # CSP="" (base) gets no suffix; otherwise -aws, -azure, etc. The
          # metadata-action flavor below appends this to every tag, so image_tag
          # stays unsuffixed here to avoid doubling it; the pushed tag is
          # build-<sha>-<ts><suffix>.
          echo "image_tag=build-${SHA}-${TIMESTAMP}" | tee -a "$GITHUB_OUTPUT"
          echo "suffix=${CSP:+-$CSP}" | tee -a "$GITHUB_OUTPUT"
          echo "TIMESTAMP=${TIMESTAMP}" >> "$GITHUB_ENV"

      - uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Append the CSP to every tag (empty for the base image) so the matrix
          # variants publish to distinct tags instead of clobbering each other.
          flavor: |
            suffix=${{ steps.flux-tag.outputs.suffix }},onlatest=true
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,format=long
            type=raw,value=${{ steps.flux-tag.outputs.image_tag }}

      - uses: docker/setup-docker-action@0234bb73ccb40f0c430b795634f9247e2b5c2d23 # v5.2.0
        with:
          daemon-config: |
            {
              "debug": true,
              "features": {
                "containerd-snapshotter": true
              }
            }

      # Log in unconditionally: pushes/tags need write, PRs need read for cache-from.
      - name: Login to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4.1.0
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Build and push
        id: push
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        env:
          SOURCE_DATE_EPOCH: ${{ env.TIMESTAMP }}
        with:
          context: .
          file: Dockerfile
          # Selects the CSP-specific layers at the bottom of the Dockerfile;
          # empty builds the base image.
          build-args: |
            CSP=${{ matrix.csp }}
          # Build arm64 only on real pushes; QEMU emulation is slow and PRs only
          # need to prove the image still builds.
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ steps.meta.outputs.tags }}
          # Cache is per-CSP (suffixed like the tags) so variants don't poison
          # each other's layers.
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache${{ steps.flux-tag.outputs.suffix }}
          # Only write cache on pushes; PRs aren't authorized to write to GHCR.
          cache-to: ${{ github.event_name != 'pull_request' && format('type=registry,ref={0}/{1}:buildcache{2},mode=max', env.REGISTRY, env.IMAGE_NAME, steps.flux-tag.outputs.suffix) || '' }}
          # Attestations only matter for images we keep, so skip them on PRs.
          provenance: ${{ github.event_name != 'pull_request' && 'mode=max' || 'false' }}
          sbom: ${{ github.event_name != 'pull_request' }}
          # push is folded into outputs so we can also pass rewrite-timestamp, which
          # rewrites layer file timestamps for reproducibility (needs buildx >= 0.13,
          # provided by setup-buildx above).
          outputs: type=image,push=${{ github.event_name != 'pull_request' }},rewrite-timestamp=true

      # Scan the pushed image by digest, decoupling the scan from the tag set above.
      # Report-only: exit-code below still flags findings, but continue-on-error
      # keeps a failing scan from failing the job (the image is already pushed).
      - name: Scan image for vulnerabilities
        if: github.event_name != 'pull_request'
        continue-on-error: true
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
