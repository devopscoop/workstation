# References:
# https://docs.github.com/en/packages/managing-github-packages-using-github-actions-workflows/publishing-and-installing-a-package-with-github-actions#publishing-a-package-using-an-action
# https://docs.docker.com/build/ci/github-actions/multi-platform/
# https://docs.docker.com/build/ci/github-actions/manage-tags-labels/
# https://docs.docker.com/build/ci/github-actions/cache/
# https://docs.docker.com/build/ci/github-actions/attestations/
# https://docs.docker.com/build/ci/github-actions/reproducible-builds/
# https://fluxcd.io/flux/guides/image-update/#imagepolicy-examples

name: Build Image

on:
  push:
    branches:
      - main
      - dev
    tags:
      - "v[0-9]*"
    paths-ignore:
      - "**.md"
      - "**.adoc"
      - CODEOWNERS
      - .editorconfig
      - .gitignore
      - .prettierignore
      - .prettierrc
      - .sops.yaml
      - docker-compose.yml
  pull_request:
    branches:
      - main
      - dev
    paths-ignore:
      - "**.md"
      - "**.adoc"
      - CODEOWNERS

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

# Serialize runs per ref. Cancel superseded PR runs to save minutes, but let
# push/tag runs finish so every commit FluxCD might deploy still produces an image.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-image:
    runs-on: ubuntu-latest
    # Ceiling so a hung QEMU arm64 build can't burn the 6h default. Raise if
    # emulated builds legitimately run longer.
    timeout-minutes: 45
    outputs:
      image_tag: ${{ steps.flux-tag.outputs.image_tag }}
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    steps:
      # Authenticate to Docker Hub so base-image pulls during the build avoid
      # anonymous rate limits. Skipped on fork PRs, which can't read the secret.
      # https://docs.docker.com/docker-hub/usage/
      - name: Login to Docker Hub
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: dfinitysa
          password: ${{ secrets.DOCKER_TOKEN }}

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Tag format build-${sha7}-${unix_timestamp} drives FluxCD image automation.
      # The commit timestamp is reused as SOURCE_DATE_EPOCH for reproducible builds.
      - name: Compute image tag and build timestamp
        id: flux-tag
        run: |
          TIMESTAMP="$(git log -1 --pretty=%ct)"
          SHA="$(git rev-parse --short=7 HEAD)"
          echo "image_tag=build-${SHA}-${TIMESTAMP}" | tee -a "$GITHUB_OUTPUT"
          echo "TIMESTAMP=${TIMESTAMP}" >> "$GITHUB_ENV"

      - uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,format=long
            type=raw,value=${{ steps.flux-tag.outputs.image_tag }}

      - uses: docker/setup-docker-action@e43656e248c0bd0647d3f5c195d116aacf6fcaf4 # v4.7.0
        with:
          daemon-config: |
            {
              "debug": true,
              "features": {
                "containerd-snapshotter": true
              }
            }

      # Log in unconditionally: pushes/tags need write, PRs need read for cache-from.
      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build and push
        id: push
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        env:
          SOURCE_DATE_EPOCH: ${{ env.TIMESTAMP }}
        with:
          context: .
          file: Dockerfile
          # Build arm64 only on real pushes; QEMU emulation is slow and PRs only
          # need to prove the image still builds.
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          # Only write cache on pushes; PRs aren't authorized to write to GHCR.
          cache-to: ${{ github.event_name != 'pull_request' && format('type=registry,ref={0}/{1}:buildcache,mode=max', env.REGISTRY, env.IMAGE_NAME) || '' }}
          # Attestations only matter for images we keep, so skip them on PRs.
          provenance: ${{ github.event_name != 'pull_request' && 'mode=max' || 'false' }}
          sbom: ${{ github.event_name != 'pull_request' }}
          # push is folded into outputs so we can also pass rewrite-timestamp, which
          # rewrites layer file timestamps for reproducibility (needs buildx >= 0.13,
          # provided by setup-buildx above).
          outputs: type=image,push=${{ github.event_name != 'pull_request' }},rewrite-timestamp=true

      # Scan the pushed image by digest, decoupling the scan from the tag set above.
      - name: Scan image for vulnerabilities
        if: github.event_name != 'pull_request'
        uses: aquasecurity/trivy-action@18f2510ee396bbf400402947b394f2dd8c87dbb0 # 0.29.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
